<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BZ-TIERS | Official Competitive Rankings</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body { 
            background: #0d0e12; 
            color: #d1d5db; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 40px 15px; 
            min-height: 100vh;
        }

        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { 
            font-size: 2.8rem; 
            color: #ffffff; 
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .header h1 span { 
            color: #a855f7; 
            text-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
        }
        .header p { color: #6b7280; font-size: 0.95rem; margin-top: 6px; font-weight: 500; }

        /* Search Section */
        .search-container {
            width: 100%;
            max-width: 820px;
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
        }
        .search-input {
            flex: 1;
            background: #141721;
            border: 1px solid #23283b;
            border-radius: 10px;
            padding: 14px 20px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }
        .search-input:focus {
            border-color: #a855f7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);
        }
        .search-btn {
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            border: none;
            color: #fff;
            padding: 0 25px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .search-btn:hover { transform: scale(1.02); }

        /* Profile Card Modal */
        .profile-card {
            display: none;
            background: #141721;
            border: 1px solid #23283b;
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8);
            text-align: center;
            position: relative;
        }
        .profile-avatar-container {
            position: relative;
            display: inline-block;
            margin-bottom: 12px;
        }
        .profile-skin-bust {
            height: 110px;
            width: auto;
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.7));
        }
        .profile-name { font-size: 2rem; color: #fff; font-weight: 800; letter-spacing: 0.5px; }
        .profile-title-badge { 
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(234, 179, 8, 0.15);
            border: 1px solid rgba(234, 179, 8, 0.4);
            color: #facc15;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 6px 14px;
            border-radius: 20px;
            margin: 8px 0 15px 0;
        }
        .profile-region { color: #9ca3af; font-size: 0.9rem; font-weight: 600; margin-bottom: 20px; }
        
        .profile-position-box {
            background: #1b1f2e;
            border: 1px solid #282e45;
            border-radius: 12px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .rank-label { color: #facc15; font-weight: 900; font-size: 1.2rem; font-style: italic; }
        .overall-label { color: #fff; font-weight: 800; font-size: 1rem; letter-spacing: 1px; }
        .points-label { color: #9ca3af; font-weight: 600; font-size: 0.85rem; }

        .profile-tiers-container {
            background: #181c2a;
            border: 1px solid #23283b;
            border-radius: 12px;
            padding: 15px;
        }
        .profile-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .mode-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .mode-icon { width: 28px; height: 28px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }

        /* Mode Select Tabs */
        .tabs { 
            display: flex; 
            gap: 8px; 
            flex-wrap: wrap; 
            justify-content: center; 
            margin-bottom: 30px;
            background: #141721;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid #23283b;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .tab-btn { 
            background: transparent; 
            border: 1px solid transparent; 
            color: #9ca3af; 
            padding: 8px 16px; 
            font-weight: 700; 
            font-size: 0.85rem;
            border-radius: 8px; 
            cursor: pointer; 
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease; 
        }
        .tab-btn:hover { color: #ffffff; background: rgba(255,255,255,0.04); }
        .tab-btn.active { 
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%); 
            color: #ffffff; 
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.35);
        }
        .tab-btn svg { width: 18px; height: 18px; fill: currentColor; }

        /* Leaderboard Table */
        .table-card { 
            background: #141721; 
            border-radius: 14px; 
            width: 100%; 
            max-width: 820px; 
            overflow: hidden; 
            border: 1px solid #23283b; 
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7); 
        }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #1a1e2b; color: #a855f7; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; }
        th, td { padding: 12px 22px; vertical-align: middle; }
        tr { border-bottom: 1px solid #23283b; }
        tr:last-child { border-bottom: none; }
        tr:hover { background: rgba(255, 255, 255, 0.015); }

        /* Custom BZ Tier Badges */
        .tier-badge { 
            font-weight: 800; 
            padding: 4px 8px; 
            border-radius: 6px; 
            display: inline-block; 
            font-size: 0.75rem; 
            min-width: 44px; 
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .none { background: #23283b; color: #4b5563; }
        .ht1 { background: #ff3355; color: #fff; } 
        .lt1 { background: #ff6633; color: #fff; } 
        .ht2 { background: #ffaa00; color: #fff; } 
        .lt2 { background: #ffd000; color: #000; } 
        .ht3 { background: #10b981; color: #fff; } 
        .lt3 { background: #059669; color: #fff; } 
        .ht4 { background: #06b6d4; color: #fff; } 
        .lt4 { background: #3b82f6; color: #fff; } 
        .ht5 { background: #8b5cf6; color: #fff; } 
        .lt5 { background: #4b5563; color: #fff; } 

        .player-info { display: flex; align-items: center; gap: 14px; font-weight: 600; color: #f3f4f6; }
        .player-skin { height: 42px; width: auto; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }

        .footer-action {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 30px;
            gap: 10px;
        }

        .btn-discord { 
            display: inline-block; 
            background: linear-gradient(135deg, #5865f2 0%, #404feedb 100%); 
            color: #ffffff; 
            text-decoration: none; 
            padding: 14px 32px; 
            border-radius: 10px; 
            font-weight: 700; 
            font-size: 0.95rem;
            box-shadow: 0 4px 20px rgba(88, 101, 242, 0.35);
            transition: all 0.2s ease; 
        }
        .btn-discord:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(88, 101, 242, 0.5); }

        .rules-notice {
            color: #9ca3af;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .rules-notice span {
            color: #a855f7;
            font-weight: 700;
        }
    </style>
</head>
