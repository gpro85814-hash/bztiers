<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BZ-TIERS | Competitive Tier Rankings</title>
    <style>
        :root {
            --bg-dark: #0a0c10;
            --card-bg: #12151e;
            --accent-purple: #5865f2;
            --accent-hover: #4752c4;
            --text-main: #ffffff;
            --text-muted: #949ba4;
            --border-color: #1e2230;
            
            /* Tier Colors */
            --tier1-color: #d4af37;
            --tier2-color: #a0a5b5;
            --tier3-color: #cd7f32;
            --tier4-color: #4b6b94;
            --tier5-color: #5865f2;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 15px;
        }

        header h1 {
            font-size: 2.8rem;
            margin: 0;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #fff, var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            margin-top: 5px;
        }

        .search-container {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .search-container input {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 6px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            width: 240px;
        }

        .search-container button {
            background-color: var(--accent-purple);
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .search-container button:hover {
            background-color: var(--accent-hover);
        }

        .modes-nav {
            display: flex;
            gap: 6px;
            background-color: var(--card-bg);
            padding: 6px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .tab-btn:hover {
            color: white;
        }

        .tab-btn.active {
            background-color: var(--accent-purple);
            color: white;
        }

        /* 5-Column Tier Board */
        .tier-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            width: 95%;
            max-width: 1400px;
            margin-bottom: 40px;
        }

        @media (max-width: 1100px) {
            .tier-board {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .tier-board {
                grid-template-columns: 1fr;
            }
        }

        .tier-column {
            background-color: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .tier-header {
            padding: 12px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border-color);
        }

        .tier-1 .tier-header { color: var(--tier1-color); background: rgba(212, 175, 55, 0.08); }
        .tier-2 .tier-header { color: var(--tier2-color); background: rgba(160, 165, 181, 0.08); }
        .tier-3 .tier-header { color: var(--tier3-color); background: rgba(205, 127, 50, 0.08); }
        .tier-4 .tier-header { color: var(--tier4-color); background: rgba(75, 107, 148, 0.08); }
        .tier-5 .tier-header { color: var(--tier5-color); background: rgba(88, 101, 242, 0.08); }

        .player-list {
            padding: 8px;
            display: flex;
            flex-direction: column;
