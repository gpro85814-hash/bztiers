<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BZ-TIERS | Official Competitive Rankings</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body { 
            background: #090a0f; 
            color: #d1d5db; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 40px 15px; 
            min-height: 100vh;
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { 
            font-size: 2.8rem; 
            color: #ffffff; 
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .header h1 span { 
            color: #a855f7; 
            text-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
        }
        .header p { color: #6b7280; font-size: 0.95rem; margin-top: 6px; font-weight: 500; }
        
        /* Unique BZ-TIERS Navigation Bar */
        .tabs { 
            display: flex; 
            gap: 8px; 
            flex-wrap: wrap; 
            justify-content: center; 
            margin-bottom: 30px;
            background: #11131f;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid #1f2438;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .tab-btn { 
            background: transparent; 
            border: 1px solid transparent; 
            color: #9ca3af; 
            padding: 9px 18px; 
            font-weight: 700; 
            font-size: 0.85rem;
            border-radius: 8px; 
            cursor: pointer; 
            transition: all 0.2s ease; 
        }
        .tab-btn:hover { color: #ffffff; background: rgba(255,255,255,0.04); }
        .tab-btn.active { 
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%); 
            color: #ffffff; 
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.35);
        }

        /* Leaderboard Container */
        .table-card { 
            background: #11131f; 
            border-radius: 14px; 
            width: 100%; 
            max-width: 820px; 
            overflow: hidden; 
            border: 1px solid #1f2438; 
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7); 
        }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #16192b; color: #a855f7; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; }
        th, td { padding: 16px 22px; }
        tr { border-bottom: 1px solid #1f2438; }
        tr:last-child { border-bottom: none; }
        tr:hover { background: rgba(255, 255, 255, 0.015); }

        /* Custom BZ Tier Badges */
        .tier-badge { 
            font-weight: 800; 
            padding: 5px 10px; 
            border-radius: 6px; 
            display: inline-block; 
            font-size: 0.75rem; 
            width: 46px; 
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        
        .ht1 { background: #ff3355; color: #fff; } 
        .lt1 { background: #ff6633; color: #fff; } 
        .ht2 { background: #ffaa00; color: #fff; } 
        .lt2 { background: #ffd000; color: #000; } 
        .ht3 { background: #10b981; color: #fff; } 
        .lt3 { background: #059669; color: #fff; } 
        .ht4 { background: #06b6d4; color: #fff; } 
        .lt4 { background: #3b82f6; color: #fff; } 
        .ht5 { background: #8b5cf6; color: #fff; } 
        .lt5 { background: #4b5563; color: #fff; } 

        .player-info { display: flex; align-items: center; gap: 12px; font-weight: 600; color: #f3f4f6; }
        .player-avatar { width: 28px; height: 28px; border-radius: 6px; background: #090a0f; border: 1px solid #1f2438; }

        .footer-action {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 30px;
            gap: 10px;
        }

        .btn-discord { 
            display: inline-block; 
            background: linear-gradient(135deg, #5865f2 0%, #404feedb 100%); 
            color: #ffffff; 
            text-decoration: none; 
            padding: 14px 32px; 
            border-radius: 10px; 
            font-weight: 700; 
            font-size: 0.95rem;
            box-shadow: 0 4px 20px rgba(88, 101, 242, 0.35);
            transition: all 0.2s ease; 
        }
        .btn-discord:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(88, 101, 242, 0.5); }

        .rules-notice {
            color: #9ca3af;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .rules-notice span {
            color: #a855f7;
            font-weight: 700;
        }
    </style>
</head>
