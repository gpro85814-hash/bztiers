<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BZ-TIERS | Official Competitive Rankings</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body { 
            background: #090a0f; 
            color: #d1d5db; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 40px 15px; 
            min-height: 100vh;
        }

        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { 
            font-size: 2.8rem; 
            color: #ffffff; 
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .header h1 span { 
            color: #a855f7; 
            text-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
        }
        .header p { color: #6b7280; font-size: 0.95rem; margin-top: 6px; font-weight: 500; }

        /* MCTiers Search Section */
        .search-container {
            width: 100%;
            max-width: 820px;
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
        }
        .search-input {
            flex: 1;
            background: #11131f;
            border: 1px solid #1f2438;
            border-radius: 10px;
            padding: 14px 20px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }
        .search-input:focus {
            border-color: #a855f7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);
        }
        .search-btn {
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            border: none;
            color: #fff;
            padding: 0 25px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .search-btn:hover { transform: scale(1.02); }

        /* Player Profile Card */
        .profile-card {
            display: none;
            background: #11131f;
            border: 1px solid #1f2438;
            border-radius: 14px;
            width: 100%;
            max-width: 820px;
            padding: 24px;
            margin-bottom: 30px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7);
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            border-bottom: 1px solid #1f2438;
            padding-bottom: 15px;
        }
        .profile-skin { height: 75px; width: auto; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6)); }
        .profile-details h2 { font-size: 1.8rem; color: #fff; font-weight: 800; }
        .profile-title { color: #a855f7; font-weight: 700; font-size: 0.9rem; text-transform: uppercase; margin-top: 2px; }
        .profile-stats { display: flex; gap: 15px; margin-top: 8px; }
        .stat-badge { background: #16192b; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; color: #9ca3af; }
        .stat-badge span { color: #fff; }

        .profile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 12px;
        }
        .mode-box {
            background: #16192b;
            border: 1px solid #1f2438;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }
        .mode-box .mode-name { font-size: 0.75rem; color: #6b7280; font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
        
        /* Navigation Bar */
        .tabs { 
            display: flex; 
            gap: 8px; 
            flex-wrap: wrap; 
            justify-content: center; 
            margin-bottom: 30px;
            background: #11131f;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid #1f2438;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .tab-btn { 
            background: transparent; 
            border: 1px solid transparent; 
            color: #9ca3af; 
            padding: 9px 18px; 
            font-weight: 700; 
            font-size: 0.85rem;
            border-radius: 8px; 
            cursor: pointer; 
            transition: all 0.2s ease; 
        }
        .tab-btn:hover { color: #ffffff; background: rgba(255,255,255,0.04); }
        .tab-btn.active { 
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%); 
            color: #ffffff; 
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.35);
        }

        /* Leaderboard Container */
        .table-card { 
            background: #11131f; 
            border-radius: 14px; 
            width: 100%; 
            max-width: 820px; 
            overflow: hidden; 
            border: 1px solid #1f2438; 
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7); 
        }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #16192b; color: #a855f7; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; }
        th, td { padding: 12px 22px; vertical-align: middle; }
        tr { border-bottom: 1px solid #1f2438; }
        tr:last-child { border-bottom: none; }
        tr:hover { background: rgba(255, 255, 255, 0.015); }

        /* Custom BZ Tier Badges */
        .tier-badge { 
            font-weight: 800; 
            padding: 5px 10px; 
            border-radius: 6px; 
            display: inline-block; 
            font-size: 0.75rem; 
            width: 46px; 
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        
        .none { background: #1f2438; color: #4b5563; }
        .ht1 { background: #ff3355; color: #fff; } 
        .lt1 { background: #ff6633; color: #fff; } 
        .ht2 { background: #ffaa00; color: #fff; } 
        .lt2 { background: #ffd000; color: #000; } 
        .ht3 { background: #10b981; color: #fff; } 
        .lt3 { background: #059669; color: #fff; } 
        .ht4 { background: #06b6d4; color: #fff; } 
        .lt4 { background: #3b82f6; color: #fff; } 
        .ht5 { background: #8b5cf6; color: #fff; } 
        .lt5 { background: #4b5563; color: #fff; } 

        .player-info { display: flex; align-items: center; gap: 14px; font-weight: 600; color: #f3f4f6; }
        .player-skin { height: 48px; width: auto; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }

        .footer-action {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 30px;
            gap: 10px;
        }

        .btn-discord { 
            display: inline-block; 
            background: linear-gradient(135deg, #5865f2 0%, #404feedb 100%); 
            color: #ffffff; 
            text-decoration: none; 
            padding: 14px 32px; 
            border-radius: 10px; 
            font-weight: 700; 
            font-size: 0.95rem;
            box-shadow: 0 4px 20px rgba(88, 101, 242, 0.35);
            transition: all 0.2s ease; 
        }
        .btn-discord:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(88, 101, 242, 0.5); }

        .rules-notice {
            color: #9ca3af;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .rules-notice span {
            color: #a855f7;
            font-weight: 700;
        }
    </style>
</head>

    </div>

    <div class="search-container">

        </div>
        <div id="profile-tiers-grid" class="profile-grid">

    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchMode('sword', event)">Sword</button>

            <tbody id="ranking-list">

        </table>
    </div>

        <p class="rules-notice">After Clicking The Button Make Sure To Read <span>#rules</span></p>
    </div>

        function switchMode(mode, e) {
            if (e) {
                const buttons = document.querySelectorAll('.tab-btn');
                buttons.forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
            }

            const list = document.getElementById('ranking-list');
            list.innerHTML = '';

            if (rankingsData[mode]) {
                rankingsData[mode].forEach(p => {
                    list.innerHTML += `
                        <tr>
                            <td>${p.rank}</td>
                            <td>
                                <div class="player-info">
                                    <img class="player-skin" src="https://visage.surgeplay.com/front/128/${p.name}" alt="${p.name}" onerror="this.src='https://visage.surgeplay.com/front/128/Steve'">
                                    ${p.name}
                                </div>
                            </td>
                            <td><span class="tier-badge ${p.tierClass}">${p.tier}</span></td>
                            <td>${p.region}</td>
                        </tr>
                    `;
                });
            }
        }

        function searchPlayer() {
            const query = document.getElementById('player-search').value.trim().toLowerCase();
            const card = document.getElementById('profile-card');
            
            if (!query) {
                card.style.display = 'none';
                return;
            }

            const modes = ['sword', 'crystal', 'axe', 'nethop', 'pot', 'smp', 'uhc', 'vanilla', 'mace'];
            let foundPlayerName = "";
            let foundRegion = "NA";
            let totalPoints = 0;
            let playerTiers = {};

            modes.forEach(mode => {
                const record = rankingsData[mode]?.find(p => p.name.toLowerCase() === query);
                if (record) {
                    foundPlayerName = record.name;
                    foundRegion = record.region;
                    playerTiers[mode] = { tier: record.tier, tierClass: record.tierClass };
                    totalPoints += (pointValues[record.tier] || 0);
                } else {
                    playerTiers[mode] = { tier: "N/A", tierClass: "none" };
                }
            });

            if (!foundPlayerName) {
                foundPlayerName = query;
            }

            // Title rank calculation based on total accumulated points
            let titleRank = "Combat Candidate";
            if (totalPoints >= 400) titleRank = "Combat Grandmaster";
            else if (totalPoints >= 250) titleRank = "Combat Master";
            else if (totalPoints >= 120) titleRank = "Combat Ace";
            else if (totalPoints >= 50) titleRank = "Combat Specialist";

            // Populate profile
            document.getElementById('profile-name').innerText = foundPlayerName;
            document.getElementById('profile-title').innerText = titleRank;
            document.getElementById('profile-points').innerText = totalPoints;
            document.getElementById('profile-region').innerText = foundRegion;
            document.getElementById('profile-skin-img').src = `https://visage.surgeplay.com/front/128/${foundPlayerName}`;

            const grid = document.getElementById('profile-tiers-grid');
            grid.innerHTML = '';
            modes.forEach(mode => {
                grid.innerHTML += `
                    <div class="mode-box">
                        <div class="mode-name">${mode}</div>
                        <span class="tier-badge ${playerTiers[mode].tierClass}">${playerTiers[mode].tier}</span>
                    </div>
                `;
            });

            card.style.display = 'block';
        }

        switchMode('sword');
    </script>
</body>
</html>
